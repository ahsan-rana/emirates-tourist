<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — Emirates Tourist</title>
<meta name="description" content="UAE travel guide article from Emirates Tourist.">
<link rel="canonical" href="https://emiratestourist.com/article.html">
<meta property="og:type" content="article"><meta property="og:site_name" content="Emirates Tourist"><meta property="og:title" content="Article — Emirates Tourist"><meta property="og:image" content="https://emiratestourist.com/assets/img/dubai-skyline-sunset.webp"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#0b1f3a">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
<section class="article-hero" id="hero"></section>
<div class="container article-wrap">
  <article class="article" id="body"></article>
  <aside class="article-side">
    <div class="side-card"><h4>Written by</h4><div class="author"><div class="av">ET</div><div><b>Emirates Tourist guides</b><div class="muted" style="font-size:13px">Licensed UAE tour operator, Dubai</div></div></div></div>
    <div class="side-card"><h4>In this article</h4><div class="toc" id="toc"></div></div>
    <div class="side-card"><h4>Share</h4><div class="share" id="share"></div></div>
    <div class="side-card" style="background:var(--navy);color:#fff;border:0"><h4 style="color:var(--gold-2)">Plan it with us</h4><p style="font-size:14px;color:#cfd8e6;margin-bottom:14px">Tell us your dates and we'll turn this article into a bookable itinerary.</p><a class="btn btn-primary btn-block" href="planner.html">Open trip planner</a><a class="btn btn-light btn-block" style="margin-top:8px" href="https://wa.me/971554439551" target="_blank">WhatsApp us</a></div>
  </aside>
</div>
<section class="section"><div class="container">
  <div class="section-head"><div><span class="eyebrow">Keep reading</span><h2 class="h2">More from the blog</h2></div><a class="btn btn-ghost" href="blog.html">All articles</a></div>
  <div class="grid grid-3" id="more"></div>
</div></section>
<script src="assets/icons.js?v=4"></script><script src="assets/i18n.js?v=4"></script><script src="assets/data.js?v=4"></script><script src="assets/articles.js?v=4"></script><script src="assets/app.js?v=4"></script>
<script>
(function(){const {$}=ET; const id=ET.q.get("id"); const p=ET.byId(ET.posts,id)||ET.posts[0]; const body=ET.articles[p.id]||"<p>Article coming soon.</p>";
  const fmt=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  document.title=p.title+" — Emirates Tourist"; document.querySelector('meta[name=description]').content=p.excerpt; document.querySelector('link[rel=canonical]').href="https://emiratestourist.com/article.html?id="+p.id;
  document.querySelector('meta[property="og:title"]').content=p.title; document.querySelector('meta[property="og:image"]').content=p.img;
  $("#hero").innerHTML=`<img src="${p.img}" alt="" ${ET.imgFallback}><div class="container"><div class="crumbs"><a href="index.html">Home</a> › <a href="blog.html">Blog</a> › ${p.cat}</div><h1>${p.title}</h1><div class="meta"><span class="badge badge-gold">${p.cat}</span><span>${ET.icon("calendar",14)} ${fmt(p.date)}</span><span>${ET.icon("clock",14)} ${p.read} read</span><span>${ET.icon("user",14)} Emirates Tourist guides</span></div></div>`;
  $("#body").innerHTML=body;
  const hs=[...document.querySelectorAll("#body h2")]; hs.forEach((h,i)=>h.id="s"+(i+1)); $("#toc").innerHTML=hs.map(h=>`<a href="#${h.id}">${h.textContent}</a>`).join("")||"<span class='muted' style='font-size:13px'>—</span>";
  const url=encodeURIComponent(location.href), t=encodeURIComponent(p.title);
  $("#share").innerHTML=`<a href="https://wa.me/?text=${t}%20${url}" target="_blank" title="WhatsApp">${ET.icon("whatsapp",16)}</a><a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" title="Facebook">${ET.icon("facebook",16)}</a><a href="https://twitter.com/intent/tweet?url=${url}&text=${t}" target="_blank" title="X">${ET.icon("x-social",15)}</a><a href="mailto:?subject=${t}&body=${url}" title="Email">${ET.icon("mail",16)}</a>`;
  $("#more").innerHTML=ET.posts.filter(x=>x.id!==p.id).slice(0,3).map(ET.postCard).join(""); document.dispatchEvent(new Event("et:rendered"));
  const ld={"@context":"https://schema.org","@type":"Article","headline":p.title,"datePublished":p.date,"image":p.img,"author":{"@type":"Organization","name":"Emirates Tourist"},"publisher":{"@type":"Organization","name":"Emirates Tourist","logo":{"@type":"ImageObject","url":"https://emiratestourist.com/assets/img/logo.webp"}},"description":p.excerpt};
  const s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify(ld); document.head.appendChild(s);
})();
</script>
</body></html>
