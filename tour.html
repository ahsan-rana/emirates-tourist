<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tour details — Emirates Tourist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="canonical" href="https://emiratestourist.com/tour.html">
<meta name="description" content="Full details, inclusions, itinerary and instant booking for this UAE experience.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Emirates Tourist">
<meta property="og:title" content="Tour details — Emirates Tourist">
<meta property="og:description" content="Full details, inclusions, itinerary and instant booking for this UAE experience.">
<meta property="og:url" content="https://emiratestourist.com/tour.html">
<meta property="og:image" content="https://emiratestourist.com/assets/img/dubai-skyline-sunset.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b1f3a">
<link rel="stylesheet" href="assets/styles.css?v=4">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
<div class="container" id="page"></div>
<section class="section"><div class="container">
  <div class="section-head"><div><span class="eyebrow">You may also like</span><h2 class="h2">Similar experiences</h2></div></div>
  <div class="grid grid-4" id="similar"></div>
</div></section>
<script src="assets/icons.js?v=4"></script><script src="assets/i18n.js?v=4"></script><script src="assets/data.js?v=4"></script><script src="assets/articles.js?v=4"></script><script src="assets/app.js?v=4"></script>
<script>
(function(){
  const {$}=ET; const t=ET.byId(ET.tours,ET.q.get("id"))||ET.tours[0]; document.title=t.title+" — Emirates Tourist";
  const gallery=[t.img,...ET.tours.filter(x=>x.id!==t.id&&x.emirate===t.emirate).slice(0,4).map(x=>x.img)];
  const timeline=[["Pickup","Hotel pickup in an air-conditioned 4x4 or coach"],["+45 min","Arrive and start the main activity"],["Mid-way","Break for photos, refreshments and free time"],["Final hour","Highlights, show or sunset viewing"],["Drop-off","Return to your hotel"]];
  const render=()=>{$("#page").innerHTML=`
    <div class="crumbs" style="margin-top:24px;color:var(--muted)"><a href="index.html">Home</a> › <a href="tours.html">Tours</a> › <a href="tours.html?emirate=${t.emirate}">${ET.emirateName(t.emirate)}</a></div>
    <div class="detail-hero">${gallery.map(g=>`<div><img src="${g}" alt="" ${ET.imgFallback}></div>`).join("")}</div>
    <div class="detail">
      <div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge badge-gold">${t.badge}</span><span class="badge badge-navy">${ET.catName(t.cat)}</span></div>
        <h1 style="margin-top:12px">${t.title}</h1>
        <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;align-items:center"><span class="stars">${ET.stars(t.rating)}</span><b>${t.rating}</b><span class="muted">${t.reviews.toLocaleString()} verified reviews</span><span class="muted">· <svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> ${ET.emirateName(t.emirate)}</span><button class="heart" data-id="${t.id}" style="position:static;border:1px solid var(--line)">${ET.icon("heart",16)}</button></div>
        <div class="facts"><div><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Duration<b>${t.duration}</b></div><div><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Group<b>${t.group}</b></div><div><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C21.1 6.8 20.4 6 19.5 6H4.5C3.6 6 2.9 6.8 2.6 7.8l-1.4 5c-.1.4-.2.8-.2 1.2 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg> Transport<b>${t.pickup?"Pickup included":"Meet on site"}</b></div><div><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="m14 18 6 0"/></svg> Languages<b>EN · AR · HI · RU · ZH</b></div></div>
        <h3>Highlights</h3><ul class="ticks">${t.highlights.map(h=>`<li>${h}</li>`).join("")}</ul>
        <h3>What's included</h3><ul class="ticks">${t.includes.map(h=>`<li>${h}</li>`).join("")}</ul>
        <h3>Itinerary</h3><div class="timeline">${timeline.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("")}</div>
        <h3>Good to know</h3><p class="muted">Wear comfortable clothes and closed shoes. Not recommended for pregnant travellers or guests with back problems where dune bashing is involved. Children under 3 travel free. Cancellation is free up to 24 hours before the start time.</p>
        <h3>Recent reviews</h3><div class="reviews">${ET.reviews.slice(0,3).map(ET.reviewCard).join("")}</div>
      </div>
      <aside class="book-box">
        <div class="muted" style="font-size:13px">From, per adult</div>
        <div class="p">${ET.money(t.price)} ${t.was?`<small><s>${ET.money(t.was)}</s> · save ${Math.round((1-t.price/t.was)*100)}%</small>`:""}</div>
        <div class="field"><label>Date</label><input type="date" id="d" value="${new Date(Date.now()+86400000).toISOString().slice(0,10)}"></div>
        <div class="field"><label>Travellers</label><select id="pax"><option value="1">1 adult</option><option value="2" selected>2 adults</option><option value="3">3 adults</option><option value="4">4 adults</option><option value="6">6 adults</option></select></div>
        <button class="btn btn-primary btn-block" id="bookBtn">Check availability & book</button>
        <a class="btn btn-ghost btn-block" href="https://wa.me/971554439551?text=${encodeURIComponent("Hi, I have a question about: "+t.title)}" target="_blank"><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg> Ask on WhatsApp</a>
        <div class="fine">✓ Instant confirmation · ✓ Reserve now, pay later · ✓ Free cancellation 24 h</div>
        <div class="fine"><svg class="ico " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Secured by Stripe · Pay in AED, USD, EUR, GBP, INR</div>
      </aside>
    </div>`;
    $("#bookBtn").onclick=()=>ET.book(t.id,{adults:+$("#pax").value,date:$("#d").value});
    $("#similar").innerHTML=ET.tours.filter(x=>x.id!==t.id&&(x.cat===t.cat||x.emirate===t.emirate)).slice(0,4).map(ET.tourCard).join("");
    document.dispatchEvent(new Event("et:rendered")); window.scrollTo(0,0);
  };
  render(); document.addEventListener("et:currency",render);
})();
</script>
</body></html>
